[package]
name = "awr-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
awr-core.workspace = true
awr-runtime.workspace = true
awr-context.workspace = true
awr-store.workspace = true
awr-source.workspace = true
awr-local.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
toml.workspace = true
sha2.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
rmcp = { version = "3.2.0", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "signal"] }
serde_path_to_error = "0.1"

[dev-dependencies]
rusqlite.workspace = true
sha2.workspace = true
rmcp = { version = "3.2.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["time", "process"] }
