[package]
name = "awr-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "AWR Team coordinator with scoped HTTP/MCP queries and session journaling."

[dependencies]
awr-team-pg = { path = "../awr-team-pg" }
awr-core.workspace = true
awr-runtime.workspace = true
awr-team = { path = "../awr-team" }
clap = { workspace = true }
serde_json.workspace = true
serde.workspace = true
toml.workspace = true
getrandom = "0.4"
ring = "0.17.14"
zeroize = "1.9"
base64.workspace = true
sha2.workspace = true
url.workspace = true
ureq.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
rmcp = { version = "3.2.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "process", "io-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
pg-tests = ["awr-team-pg/pg-tests"]
# Opt-in network test against the public GitHub API (tests/github_live.rs).
github-live = []
# Production Team deploy: enable verified PostgreSQL TLS (sslmode=require).
tls = ["awr-team-pg/tls"]

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
awr-source.workspace = true
awr-core.workspace = true
awr-team = { path = "../awr-team" }
serde_json.workspace = true
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rmcp = { version = "3.2.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
