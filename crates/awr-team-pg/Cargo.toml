[package]
name = "awr-team-pg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "PostgreSQL coordination store for AWR Team V1. Not used by the personal SQLite runtime."

[dependencies]
awr-core.workspace = true
awr-team = { path = "../awr-team" }
awr-source = { path = "../awr-source" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ulid.workspace = true
sha2.workspace = true
url.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
deadpool-postgres.workspace = true
tokio-postgres-rustls = { version = "0.14", optional = true }
rustls = { version = "0.23", optional = true }
webpki-roots = { version = "0.26", optional = true }

[features]
default = []
# Opt-in real PostgreSQL tests. Default CI must not list them as ignored tests.
pg-tests = []
# Optional TLS for PostgreSQL connections (rustls). Client default builds stay TLS-free.
tls = ["dep:tokio-postgres-rustls", "dep:rustls", "dep:webpki-roots"]


[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
syn = { version = "2", features = ["full"] }
