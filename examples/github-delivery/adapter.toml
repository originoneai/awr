# Library configuration for one explicitly mapped optional observer.
# Use a private existing report directory and provide credentials separately.
version = 1
adapter_id = "github-delivery"
connector_id = "github-observer"
tenant_id = "example-tenant"
project_id = "example-project"
workstream_id = "00000000000000000000000001"
