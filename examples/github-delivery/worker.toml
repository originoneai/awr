# Optional Team service worker. Replace scopes and use an existing private report directory.
# Set AWR_TEAM_GITHUB_WORKER_CONFIG to this file. Credentials are provisioned separately.
version = 1

[[workers]]
project = "team"
worker_id = "github-repository-worker"
credential_env = "AWR_GITHUB_WORKER_CREDENTIAL"
provider_credential_env = "GITHUB_DELIVERY_CREDENTIAL"
# Observation mode never leases or dispatches a repository effect.
integration_enabled = false
poll_interval_ms = 1000
lease_seconds = 60
operation_timeout_ms = 15000
max_backoff_ms = 60000
page_size = 16
max_pages_per_poll = 4
max_jobs_per_poll = 16

[workers.repository]
version = 1
adapter_id = "github-delivery"
connector_id = "github-observer"
tenant_id = "example-tenant"
project_id = "example-project"
workstream_id = "00000000000000000000000001"
work_id = "api-delivery"
resource = "repository:example-api"
api_base_url = "https://api.github.com"
repository_id = 123456
owner = "example-org"
repository = "example-api"
target_branch = "main"
pull_number = 17
report_directory = "/absolute/private/github-reports"
request_timeout_ms = 3000
inspection_timeout_ms = 12000
max_response_bytes = 2097152
max_total_response_bytes = 16777216
max_blob_bytes = 1048576
max_total_blob_bytes = 4194304
max_checks = 500
max_requests = 256

[[workers.repository.checks]]
check = "ci"
name = "Build and test"
app_id = 15368
