name: npm and PyPI distributions

on:
  pull_request:
    paths: ['Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**', 'tools/project-progress-overview/public/**', 'examples/**', 'packaging/**', 'scripts/release/**', '.github/workflows/distributions.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked version to the selected registries
        type: boolean
        default: false
      version:
        description: Exact version expected in Cargo.toml
        type: string
        required: true
        default: '0.4.0'
      registry:
        description: Registry publication targets
        type: choice
        options: [both, npm, pypi]
        default: both

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: linux-x64-gnu
            runner: ubuntu-24.04
          - platform: linux-arm64-gnu
            runner: ubuntu-24.04-arm
          - platform: win32-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      CARGO_TERM_COLOR: never
      AWR_LOCAL_WEB: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Validate public tree and requested version
        env:
          EXPECTED_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python scripts/check_public_tree.py
          python scripts/release/check_version.py
          python scripts/release/test_release.py
          node --test scripts/release/test_launcher.cjs
      - name: Install build tools
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component rustfmt --component clippy
          python -m pip install -r scripts/release/requirements.txt
      - name: Install Linux wheel repair tools
        if: runner.os == 'Linux'
        run: python -m pip install auditwheel patchelf
      - name: Build native packages and license notices
        run: python scripts/release/build_packages.py --output .local/distribution
      - name: Install both packages and exercise CLI and MCP
        run: python scripts/release/smoke_install.py .local/distribution
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: distribution-${{ matrix.platform }}-${{ github.sha }}
          path: |
            .local/distribution/publish/
            .local/distribution/manifest.json
            .local/distribution/installation-checks.json
            .local/distribution/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  assemble:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: distribution-*-${{ github.sha }}
          path: .local/downloaded-distributions
      - name: Verify all platform receipts and collect identical tested bytes
        env:
          RELEASE_SOURCE_SHA: ${{ github.sha }}
        run: python scripts/release/assemble_release.py .local/downloaded-distributions --output .local/release --expected-sha "$RELEASE_SOURCE_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-packages-${{ github.sha }}
          path: .local/release/
          if-no-files-found: error
          retention-days: 30

  publish_npm:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish && (inputs.registry == 'both' || inputs.registry == 'npm')
    needs: assemble
    runs-on: ubuntu-24.04
    environment: package-registries
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm install --global npm@11.19.1
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: release-packages-${{ github.sha }}
          path: .local/release
      - name: Publish native packages, then the command wrapper
        run: python scripts/release/publish_npm.py .local/release --provenance

  publish_pypi:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish && (inputs.registry == 'both' || inputs.registry == 'pypi')
    needs: assemble
    runs-on: ubuntu-24.04
    environment: package-registries
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: release-packages-${{ github.sha }}
          path: .local/release
      - name: Publish verified wheels with the configured trusted publisher
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: .local/release/python/
