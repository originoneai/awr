name: Public repository
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  public-tree:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check_public_tree.py
      - name: Check documentation style
        run: |
          python3 scripts/check_docs_style.py --self-test
          python3 scripts/check_docs_style.py
      - name: Check assessment documentation references
        run: |
          python3 tests/fixtures/assessment/counterexamples/verify.py
          python3 tests/fixtures/assessment/contracts/verify.py
          python3 tests/fixtures/assessment/envelope/verify.py
