name: Native platform verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  git-init-reproduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Rust
        run: rustup toolchain install 1.93.1 --profile minimal
      - name: Repeated Linux Git initialization and content barrier tests
        shell: bash
        run: |
          mkdir -p .local/git-init-repro
          git --version
          cargo test -p awr-server --lib delivery_adapter::git_process --locked
          cargo test -p awr-server --test local_git_delivery --locked --no-run
          for attempt in $(seq 1 100); do
            echo "Linux Git suite attempt $attempt"
            if ! cargo test -p awr-server --test local_git_delivery --locked > ".local/git-init-repro/run-$attempt.log" 2>&1; then
              cat ".local/git-init-repro/run-$attempt.log"
              exit 1
            fi
          done
      - name: Preserve synthetic reproduction logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: git-init-repro
          path: .local/git-init-repro/
          include-hidden-files: true
          retention-days: 7
