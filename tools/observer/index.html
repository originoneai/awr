<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AWR 观测台</title>
    <!-- server.js replaces the two CSP nonce tokens with a per-response nonce. -->
    <script nonce="__CSP_NONCE_ATTR__">
      window.__CSP_NONCE__ = "__CSP_NONCE_VALUE__";
    </script>
    <script nonce="__CSP_NONCE_ATTR__">
      (() => {
        let saved = null;
        try { saved = localStorage.getItem("awr-observer-theme"); } catch { /* Storage can be blocked. */ }
        const theme = saved === "light" || saved === "dark" ? saved
          : typeof matchMedia === "function" && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
